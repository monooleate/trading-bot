[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."*"]
  node_bundler = "esbuild"

# Scheduled scan: óránként (UTC)
[functions."scheduled-scan"]
  schedule = "0 * * * *"

# Auto-trader: minden 3 percben (UTC)
[functions."auto-trader"]
  schedule = "*/3 * * * *"

# Weather trading + reconcile a `auto-trader-multi-cron` fan-out-ban fut (lent).
# A korábbi különálló `auto-trader-weather-cron` (*/5) és
# `auto-trader-weather-reconciler-cron` (*/15) a legacy `schedule()` wrappert
# használták, ami az esbuild/.mts build alatt SOHA nem regisztrálódott → a
# weather bot 2026-05-21 óta tétlen volt (runStatus.source mindig "manual").
# 2026-05-29: kivezetve, a weather a bizonyítottan tüzelő */3 multi-cronon megy.

# Multi-cron: Hyperliquid Perp + Funding Arb + Sports + Weather (+ reconcile).
# A meglévő auto-trader cron csak a crypto category-t hívja
# (default category="crypto" a dispatcherében), ezért a HL + FR
# sessionök 18 napon át sosem futottak. Ez fan-out-ot csinál.
[functions."auto-trader-multi-cron"]
  schedule = "*/3 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
