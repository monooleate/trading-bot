name: Deploy

# Deploys to the Hetzner box AFTER CI passes on main (or on manual dispatch).
# The runner checks out the exact commit CI validated and RSYNCs the working
# tree to the box (no box-side `git pull`), then runs `docker compose up -d
# --build`. rsync-from-runner avoids GitHub's anonymous-HTTPS git rate limit
# that intermittently 401'd the box's `git pull` after a burst of deploys.
#
# REQUIRED repo secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     box IP/host (e.g. 91.99.218.165)
#   DEPLOY_USER     ssh user on the box (must be in the `docker` group)
#   DEPLOY_SSH_KEY  the PRIVATE key (full file incl. BEGIN/END lines)
# OPTIONAL:
#   DEPLOY_DIR      compose/repo dir on the box (default /opt/edgecalc)
#   DEPLOY_PORT     ssh port (default 22)
#   DEPLOY_KNOWN_HOSTS  pinned host key line (else first-connection TOFU)
#
# Box-local, git-ignored state is preserved (excluded from the rsync --delete):
#   .env / .env.save (secrets), data/ (model-cache bind mount), logs/, dist/,
#   .git/, .claude/. Everything else mirrors the deployed commit exactly.
#
# Until DEPLOY_HOST is set the job SKIPS cleanly (stays green), so pushing this
# file does not produce a red run before you finish the secret setup.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # Only when CI succeeded (dispatch runs unconditionally).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets configured
        id: chk
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "${SSH_HOST:-}" ]; then
            echo "Deploy secrets not set — skipping (add DEPLOY_HOST/USER/SSH_KEY to enable)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Check out the exact commit CI validated (head_sha on workflow_run; the
      # pushed SHA on manual dispatch).
      - name: Checkout deployed commit
        if: steps.chk.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Rsync + rebuild over SSH
        if: steps.chk.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          PORT="${SSH_PORT:-22}"
          DIR="${DEPLOY_DIR:-/opt/edgecalc}"
          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
            HOSTCHECK="-o StrictHostKeyChecking=yes"
          else
            HOSTCHECK="-o StrictHostKeyChecking=accept-new"
          fi
          RSH="ssh $HOSTCHECK -p $PORT -i ~/.ssh/id_deploy -o BatchMode=yes"

          echo "== rsync → $SSH_USER@$SSH_HOST:$DIR =="
          # --delete keeps the box tree an exact mirror of the commit; excluded
          # paths are protected from BOTH transfer and deletion (rsync default),
          # so box-local secrets/data survive. .env.example is tracked → it syncs
          # (only the literal `.env`/`.env.save` are excluded).
          rsync -rlptz --delete \
            --exclude='.git/' \
            --exclude='.claude/' \
            --exclude='.env' \
            --exclude='.env.save' \
            --exclude='data/' \
            --exclude='logs/' \
            --exclude='dist/' \
            --exclude='node_modules/' \
            -e "$RSH" \
            ./ "$SSH_USER@$SSH_HOST:$DIR/"

          echo "== compose up -d --build =="
          # Safety belt: refuse to (re)build/restart if the box-local .env is
          # missing — a misconfigured exclude must never bring the stack up
          # without secrets. The excludes above already protect it; this is the
          # loud alarm if that ever regresses.
          REMOTE_CMD="set -e; cd '$DIR'; test -f .env || { echo 'FATAL: .env missing after rsync — aborting'; exit 1; }; docker compose up -d --build; echo '== status =='; docker compose ps"
          ssh $HOSTCHECK -p "$PORT" -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$SSH_HOST" "$REMOTE_CMD"
